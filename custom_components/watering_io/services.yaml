set_target_moisture:
  name: Set planter target moisture
  description: Update one planter target moisture through the Watering.IO Hub planter config command.
  fields:
    planter_id:
      name: Planter ID
      description: The planter id to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    target_moisture:
      name: Target moisture
      description: New target moisture percentage.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
set_planter_settings:
  name: Set planter settings
  description: Update one planter's editable settings while preserving the rest of the cached planter config.
  fields:
    planter_id:
      name: Planter ID
      description: The planter id to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    target_moisture:
      name: Target moisture
      description: New target moisture percentage.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    fertilizer_steps:
      name: Fertilizer steps
      description: New fertilizer step count.
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 1
          mode: box
    max_daily_dosing_s:
      name: Max daily dosing
      description: New automatic watering cap in seconds. Use 0 to disable the cap.
      required: false
      selector:
        number:
          min: 0
          max: 86400
          step: 1
          unit_of_measurement: s
          mode: box
